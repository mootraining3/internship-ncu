<div class="jumbotron jumbotron-fluid m-3 py-4 rounded">
  <div class="container">
    <h1 class="display-6">Student</h1>
  </div>
</div>
<div class="row">
  <div class="col-sm-12 col-md-6">
    <h2>Student Data</h2>
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th scope="col">Student Id</th>
          <th scope="col">Student Name</th>
          <th scope="col">Department</th>
          <th scope="col">Email</th>
          <th>Manage</th>
        </tr>
      </thead>
      <tbody>
        @for (student of students; track $index) {
        <tr>
          <td>{{student.studentId}}</td>
          <td>{{student.studentName}}</td>
          <td>{{student.department}}</td>
          <td>{{student.email}}</td>
          <td>
            <button class="btn btn-sm btn-warning">Update</button>
            <button class="btn btn-sm btn-danger">Delete</button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
  <div class="col-sm-12 col-md-6">
    <h2>Student Form</h2>
    <!-- FORM -->
    <form>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="student-id" placeholder="">
        <label for="student-id">Student ID:</label>
      </div>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="student-name" placeholder="">
        <label for="student-name">Student Name:</label>
      </div>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="department" placeholder="">
        <label for="department">Department:</label>
      </div>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="faculty" placeholder="">
        <label for="faculty">Faculty:</label>
      </div>
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" placeholder="">
        <label for="email">E-mail:</label>
      </div>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="tel" placeholder="">
        <label for="tel">Tel.:</label>
      </div>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="picture" placeholder="">
        <label for="picture">Picture URL:</label>
      </div>
      <button class="btn btn-primary">Submit</button>
    </form>
  </div>
</div>
